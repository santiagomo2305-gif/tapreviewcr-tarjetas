<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Tarjeta Digital</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: Arial, Helvetica, sans-serif; background: #fff; margin: 0;
               display: flex; flex-direction: column; min-height: 100vh; }
        .contenido { flex: 1; display: flex; flex-direction: column; justify-content: center;
                     padding: 32px 24px; max-width: 520px; width: 100%; margin: 0 auto; }
        .datos { border-left: 6px solid #5b2a86; padding: 6px 0 6px 18px; margin-bottom: 32px; }
        h1 { font-size: 26px; color: #333; margin: 0 0 12px; line-height: 1.2; }
        h2 { font-size: 17px; color: #777; margin: 0 0 12px; line-height: 1.3; }
        .contacto { font-size: 16px; color: #888; line-height: 1.6; word-break: break-word; }
        .foto { width: 150px; height: 150px; border-radius: 50%; object-fit: cover;
                display: block; margin: 0 auto 24px; border: 3px solid #5b2a86; }
        .btn { display: block; padding: 14px; margin: 10px 0; border-radius: 30px;
               background: #f05a22; color: #fff; text-decoration: none; font-size: 16px;
               text-align: center; border: none; width: 100%; cursor: pointer; font-family: inherit; }
        .btn.sec { background: #fff; color: #5b2a86; border: 2px solid #5b2a86; }

        .banner { position: relative; height: 110px; overflow: hidden; }
        .naranja { position: absolute; left: 0; bottom: 22px; height: 68px; width: 88%;
                   background: #f05a22; border-radius: 0 34px 34px 0; color: #fff;
                   display: flex; align-items: center; gap: 10px; padding: 0 14px;
                   z-index: 2; font-size: 9px; line-height: 1.1; }
        .logo { font-style: italic; font-weight: bold; font-size: 17px; line-height: 1;
                padding-right: 6px; }
        .prod b { display: block; font-style: italic; font-size: 11px; }
        .morado { position: absolute; right: 0; bottom: 16px; width: 35%; height: 30px;
                  background: #5b2a86; border-radius: 20px 0 0 20px; z-index: 1; }
        .pill { position: absolute; right: 12px; bottom: 6px; width: 18%; height: 14px;
                background: #f05a22; border-radius: 10px; z-index: 3; }
    </style>
</head>
<body>
    <div class="contenido" id="card">
        <p>Cargando...</p>
    </div>

    <div class="banner">
        <div class="naranja">
            <div class="logo">Banco<br>Popular</div>
            <div class="logo">Banco<br>Popular</div>
            <div class="logo">Banco<br>Popular</div>
        </div>
        <div class="morado"></div>
        <div class="pill"></div>
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        const id = (params.get("id") || "").toLowerCase();
        const card = document.getElementById("card");

        function mensaje(texto) {
            card.innerHTML = "";
            const p = document.createElement("p");
            p.textContent = texto;
            card.appendChild(p);
        }

        function boton(texto, href, secundario) {
            const a = document.createElement("a");
            a.className = "btn" + (secundario ? " sec" : "");
            a.textContent = texto;
            a.href = href;
            return a;
        }

        function generarVcf(d, tel) {
            const vcf = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                "FN:" + d.nombre,
                "ORG:" + (d.empresa || ""),
                "TITLE:" + (d.cargo || ""),
                "TEL;TYPE=CELL:" + tel,
                "EMAIL:" + d.correo,
                "END:VCARD"
            ].join("\r\n");
            const blob = new Blob([vcf], { type: "text/vcard" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = d.nombre.replace(/\s+/g, "_") + ".vcf";
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        if (!/^[a-z0-9-]+$/.test(id)) {
            mensaje("Tarjeta no encontrada.");
        } else {
            fetch("clientes/" + id + ".json")
                .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                .then(d => {
                 const tel = "+506" + (d.telefonoContacto || d.telefono).replace(/\D/g, "");
                    document.title = d.nombre;
                    card.innerHTML = "";

                    if (d.foto) {
                        const img = document.createElement("img");
                        img.className = "foto";
                        img.src = d.foto;
                        img.alt = d.nombre;
                        card.append(img);
                    }

                    const datos = document.createElement("div");
                    datos.className = "datos";
                    const h1 = document.createElement("h1");
                    h1.textContent = d.nombre;
                    const h2 = document.createElement("h2");
                    h2.textContent = d.cargo || "";
                    const c = document.createElement("div");
                    c.className = "contacto";
                    c.textContent = d.telefono + " - " + d.correo;
                    datos.append(h1, h2, c);
                    card.append(datos);

                    const guardar = boton("💾 Guardar contacto", "#");
                    guardar.addEventListener("click", e => { e.preventDefault(); generarVcf(d, tel); });
                    card.append(guardar);
                })
                .catch(() => mensaje("Tarjeta no encontrada."));
        }
    </script>
</body>
</html>
